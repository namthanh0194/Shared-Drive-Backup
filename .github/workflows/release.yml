name: Publish signed release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'namthanh0194/Shared-Drive-Backup'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch tag references
        run: git fetch --tags --force origin
      - name: Install signature verifier
        run: python3 -m pip install 'cryptography>=41'
      - name: Rebuild exact archive and verify signed tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 -B tools/package_release.py --verify-tag "$RELEASE_TAG"
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          ARCHIVE="tmp/dist/shared_drive_backup-${VERSION}.zip"
          gh release create "$RELEASE_TAG" "$ARCHIVE" "$ARCHIVE.sig" --verify-tag --title "Shared Drive Backup $VERSION" --notes-file CHANGELOG.md --latest
